<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление персонами</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; }
        .card { margin-bottom: 20px; }
        .table td { vertical-align: middle; }
        .btn-sm { margin: 0 2px; }
        #message { margin-top: 15px; }
        /* чтобы ID не занимал много места */
        .id-column { width: 70px; text-align: center; }
        .actions-column { width: 160px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="mb-4">👥 Управление персонами</h1>

    <div id="message" class="alert" role="alert" style="display: none;"></div>

    <div class="row">
        <!-- Форма -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <span id="formTitle">Добавить запись</span>
                </div>
                <div class="card-body">
                    <form id="personForm">
                        <input type="hidden" id="personId" value="">

                        <div class="mb-3">
                            <label for="lastName" class="form-label">Фамилия *</label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="firstName" class="form-label">Имя *</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="patronymic" class="form-label">Отчество</label>
                            <input type="text" class="form-control" id="patronymic">
                        </div>
                        <div class="mb-3">
                            <label for="dateOfBirth" class="form-label">Дата рождения *</label>
                            <input type="date" class="form-control" id="dateOfBirth" required>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submitBtn">Добавить</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Отмена</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Таблица -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    Список персон
                    <span class="badge bg-light text-dark ms-2" id="countBadge">0</span>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th class="id-column">ID</th>
                                    <th>ФИО</th>
                                    <th>Дата рождения</th>
                                    <th>Возраст</th>
                                    <th class="actions-column">Действия</th>
                                </tr>
                            </thead>
                            <tbody id="personsTableBody">
                                <tr>
                                    <td colspan="5" class="text-center text-muted">Загрузка данных...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ---------- Настройки ----------
    const API_BASE = 'http://localhost:5220';   // измените при необходимости

    // ---------- DOM-элементы ----------
    const form = document.getElementById('personForm');
    const personIdInput = document.getElementById('personId');
    const lastNameInput = document.getElementById('lastName');
    const firstNameInput = document.getElementById('firstName');
    const patronymicInput = document.getElementById('patronymic');
    const dateOfBirthInput = document.getElementById('dateOfBirth');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formTitle = document.getElementById('formTitle');
    const tableBody = document.getElementById('personsTableBody');
    const countBadge = document.getElementById('countBadge');
    const messageDiv = document.getElementById('message');

    let editingId = null;

    // ---------- Вспомогательные функции ----------
    function showMessage(text, type = 'success') {
        messageDiv.textContent = text;
        messageDiv.className = `alert alert-${type}`;
        messageDiv.style.display = 'block';
        clearTimeout(window.messageTimeout);
        window.messageTimeout = setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 5000);
    }

    function hideMessage() {
        messageDiv.style.display = 'none';
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString;
        return date.toLocaleDateString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });
    }

    function getDateValue(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '';
        return date.toISOString().split('T')[0];
    }

    // Вычисление возраста по дате рождения
    function calculateAge(dateOfBirth) {
        const birthDate = new Date(dateOfBirth);
        if (isNaN(birthDate.getTime())) return '—';
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
            age--;
        }
        return age;
    }

    // Формирование ФИО
    function getFullName(person) {
        let parts = [person.lastName, person.firstName];
        if (person.patronymic) parts.push(person.patronymic);
        return parts.join(' ');
    }

    function resetForm() {
        personIdInput.value = '';
        lastNameInput.value = '';
        firstNameInput.value = '';
        patronymicInput.value = '';
        dateOfBirthInput.value = '';
        editingId = null;
        submitBtn.textContent = 'Добавить';
        formTitle.textContent = 'Добавить запись';
        cancelBtn.style.display = 'none';
        hideMessage();
    }

    function fillForm(person) {
        personIdInput.value = person.id;
        lastNameInput.value = person.lastName;
        firstNameInput.value = person.firstName;
        patronymicInput.value = person.patronymic || '';
        dateOfBirthInput.value = getDateValue(person.dateOfBirth);
        editingId = person.id;
        submitBtn.textContent = 'Обновить';
        formTitle.textContent = 'Редактирование';
        cancelBtn.style.display = 'inline-block';
        hideMessage();
    }

    // ---------- HTTP ----------
    async function apiRequest(method, url, body = null) {
        const options = {
            method,
            headers: { 'Content-Type': 'application/json' },
        };
        if (body) options.body = JSON.stringify(body);
        const response = await fetch(`${API_BASE}${url}`, options);
        if (!response.ok) {
            let errorText = response.statusText;
            try {
                const errorJson = await response.json();
                if (errorJson.error) errorText = errorJson.error;
            } catch (e) {}
            throw new Error(`Ошибка ${response.status}: ${errorText}`);
        }
        if (response.status === 204) return null;
        return await response.json();
    }

    // ---------- CRUD ----------
    async function loadPersons() {
        try {
            const persons = await apiRequest('GET', '/persons');
            renderTable(persons);
            countBadge.textContent = persons.length;
        } catch (error) {
            showMessage(`Не удалось загрузить список: ${error.message}`, 'danger');
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Ошибка загрузки данных</td></tr>`;
            countBadge.textContent = '0';
        }
    }

    async function addPerson(personData) {
        return await apiRequest('POST', '/persons', personData);
    }

    async function updatePerson(id, personData) {
        return await apiRequest('PUT', `/persons/${id}`, personData);
    }

    async function deletePerson(id) {
        return await apiRequest('DELETE', `/persons/${id}`);
    }

    // ---------- Отрисовка таблицы ----------
    function renderTable(persons) {
        if (!persons || persons.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Нет записей</td></tr>`;
            return;
        }

        let html = '';
        persons.forEach(p => {
            const fullName = getFullName(p);
            const age = calculateAge(p.dateOfBirth);
            const birthDateFormatted = formatDate(p.dateOfBirth);
            // сокращаем ID для читаемости (первые 8 символов)
            const shortId = p.id.substring(0, 8);

            html += `
                <tr>
                    <td class="id-column"><code>${shortId}</code></td>
                    <td>${escapeHtml(fullName)}</td>
                    <td>${birthDateFormatted}</td>
                    <td>${age}</td>
                    <td class="actions-column">
                        <button class="btn btn-sm btn-warning edit-btn" data-id="${p.id}">✏️</button>
                        <button class="btn btn-sm btn-danger delete-btn" data-id="${p.id}">🗑️</button>
                    </td>
                </tr>
            `;
        });
        tableBody.innerHTML = html;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ---------- Обработчики ----------
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();

        const lastName = lastNameInput.value.trim();
        const firstName = firstNameInput.value.trim();
        const patronymic = patronymicInput.value.trim() || null;
        const dateOfBirth = dateOfBirthInput.value;

        if (!lastName || !firstName || !dateOfBirth) {
            showMessage('Пожалуйста, заполните все обязательные поля (*)', 'warning');
            return;
        }

        const personData = {
            lastName,
            firstName,
            patronymic,
            dateOfBirth: new Date(dateOfBirth).toISOString(),
        };

        try {
            if (editingId) {
                const updateData = { ...personData, id: editingId };
                await updatePerson(editingId, updateData);
                showMessage('Запись обновлена!', 'success');
            } else {
                await addPerson(personData);
                showMessage('Запись добавлена!', 'success');
            }
            resetForm();
            await loadPersons();
        } catch (error) {
            showMessage(`Ошибка: ${error.message}`, 'danger');
        }
    });

    cancelBtn.addEventListener('click', resetForm);

    tableBody.addEventListener('click', async (e) => {
        const target = e.target.closest('button');
        if (!target) return;

        const id = target.dataset.id;
        if (!id) return;

        if (target.classList.contains('edit-btn')) {
            try {
                const person = await apiRequest('GET', `/persons/${id}`);
                fillForm(person);
            } catch (error) {
                showMessage(`Не удалось загрузить данные: ${error.message}`, 'danger');
            }
        }

        if (target.classList.contains('delete-btn')) {
            if (!confirm('Удалить запись?')) return;
            try {
                await deletePerson(id);
                showMessage('Запись удалена', 'success');
                if (editingId === id) resetForm();
                await loadPersons();
            } catch (error) {
                showMessage(`Ошибка удаления: ${error.message}`, 'danger');
            }
        }
    });

    // ---------- Старт ----------
    resetForm();
    loadPersons();
</script>

</body>
</html>
